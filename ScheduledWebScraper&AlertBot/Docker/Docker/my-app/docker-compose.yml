services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    container_name: team-dev-app-container
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - ${HOME}/.ssh:/home/node/.ssh:ro
    ports:
      - "5173:5173"
      - "3000:3000"
    working_dir: /workspace
    # install dependencies on container start (works for mounted source)
    command: /bin/sh -lc "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
